<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suricata IDS Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050a0e;
    --panel: #0a1520;
    --border: #0d2137;
    --accent: #00f0ff;
    --accent2: #ff4466;
    --accent3: #f0a500;
    --text: #c8e0f0;
    --dim: #4a6a80;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    background-image:
      linear-gradient(rgba(0,240,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,240,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  header {
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(10,21,32,0.9);
    backdrop-filter: blur(10px);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 20px;
    color: var(--accent);
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(0,240,255,0.5);
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .status-text {
    font-size: 13px;
    color: #00ff88;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 1px;
  }
  .refresh-info {
    margin-left: auto;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: var(--dim);
  }
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    background: var(--panel);
    padding: 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-value {
    font-size: 36px;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    text-shadow: 0 0 20px rgba(0,240,255,0.3);
    transition: all 0.3s;
  }
  .stat-label {
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .stat.danger .stat-value { color: var(--accent2); text-shadow: 0 0 20px rgba(255,68,102,0.3); }
  .stat.warn .stat-value { color: var(--accent3); text-shadow: 0 0 20px rgba(240,165,0,0.3); }
  .stat.ok .stat-value { color: #00ff88; text-shadow: 0 0 20px rgba(0,255,136,0.3); }
  main { padding: 24px 32px; }
  .section-title {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 12px;
    font-family: 'Share Tech Mono', monospace;
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    text-align: left;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--dim);
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'Share Tech Mono', monospace;
  }
  tbody tr {
    border-bottom: 1px solid rgba(13,33,55,0.5);
    transition: background 0.15s;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }
  tbody tr:hover { background: rgba(0,240,255,0.04); }
  td {
    padding: 12px 16px;
    font-size: 14px;
    font-family: 'Share Tech Mono', monospace;
  }
  .td-msg { font-family: 'Rajdhani', sans-serif; font-size: 15px; font-weight: 600; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 2px;
    font-size: 11px;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .sev-1 { background: rgba(255,68,102,0.15); color: var(--accent2); border: 1px solid rgba(255,68,102,0.3); }
  .sev-2 { background: rgba(240,165,0,0.15); color: var(--accent3); border: 1px solid rgba(240,165,0,0.3); }
  .sev-3 { background: rgba(0,240,255,0.1); color: var(--accent); border: 1px solid rgba(0,240,255,0.2); }
  .proto-badge {
    padding: 2px 8px;
    border-radius: 2px;
    font-size: 11px;
    background: rgba(0,240,255,0.08);
    color: var(--accent);
    border: 1px solid rgba(0,240,255,0.15);
  }
  .empty {
    text-align: center;
    padding: 80px;
    color: var(--dim);
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    letter-spacing: 2px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
</style>
</head>
<body>
<header>
  <div class="logo">⬡ SURICATA IDS</div>
  <div class="status-dot"></div>
  <div class="status-text">ENGINE ACTIVE</div>
  <div class="refresh-info">AUTO-REFRESH: 5s</div>
</header>

<div class="stats-bar">
  <div class="stat danger">
    <div class="stat-value" id="total">0</div>
    <div class="stat-label">Total Alerts</div>
  </div>
  <div class="stat danger">
    <div class="stat-value" id="high">0</div>
    <div class="stat-label">High Severity</div>
  </div>
  <div class="stat warn">
    <div class="stat-value" id="medium">0</div>
    <div class="stat-label">Medium Severity</div>
  </div>
  <div class="stat ok">
    <div class="stat-value" id="unique">0</div>
    <div class="stat-label">Unique Sources</div>
  </div>
</div>

<main>
  <div class="section-title">// Recent Alert Feed</div>
  <div class="panel">
    <table>
      <thead>
        <tr>
          <th>Timestamp</th>
          <th>Signature</th>
          <th>Proto</th>
          <th>Source</th>
          <th>Destination</th>
          <th>Severity</th>
        </tr>
      </thead>
      <tbody id="alerts-body">
        <tr><td colspan="6" class="empty">// AWAITING EVENTS</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script>
function sevLabel(s) {
  if (s === 1) return '<span class="badge sev-1">HIGH</span>';
  if (s === 2) return '<span class="badge sev-2">MEDIUM</span>';
  return '<span class="badge sev-3">LOW</span>';
}
function fmt(ts) {
  return ts ? ts.replace('T', ' ').split('+')[0].split('.')[0] : '';
}
async function fetchAlerts() {
  try {
    const res = await fetch('/api/alerts');
    const alerts = await res.json();
    document.getElementById('total').textContent = alerts.length;
    document.getElementById('high').textContent = alerts.filter(a => a.severity === 1).length;
    document.getElementById('medium').textContent = alerts.filter(a => a.severity === 2).length;
    document.getElementById('unique').textContent = new Set(alerts.map(a => a.src_ip)).size;
    const tbody = document.getElementById('alerts-body');
    if (alerts.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty">// AWAITING EVENTS</td></tr>';
      return;
    }
    tbody.innerHTML = alerts.map(a => `
      <tr>
        <td>${fmt(a.timestamp)}</td>
        <td class="td-msg">${a.msg}</td>
        <td><span class="proto-badge">${a.proto}</span></td>
        <td>${a.src_ip}</td>
        <td>${a.dest_ip}</td>
        <td>${sevLabel(a.severity)}</td>
      </tr>
    `).join('');
  } catch(e) { console.error(e); }
}
fetchAlerts();
setInterval(fetchAlerts, 5000);
</script>
</body>
</html>
